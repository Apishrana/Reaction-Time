<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reaction</title>
        <style>
            body {
                display: flex;
                width: 100%;
                height: 90vh;
                justify-content: center;
                align-items: center;
                gap: 100px;
                flex-direction: column;
                background-color: rgb(104, 255, 255);
            }
            .reaction {
                width: 450px;
                height: 200px;
                background-color: rgb(0, 132, 255);
            }
        </style>
    </head>
    <body>
        <h1>Test Your Reaction Time</h1>
        <div class="reaction"></div>
        <h3></h3>
        <script>
            const h3 = document.querySelector('h3');
            const div = document.querySelector('.reaction');
            let green = false;
            div.addEventListener('click', () => {
                div.style.backgroundColor = 'red';
                h3.textContent = 'Click when box becomes green';
                if (green){
                    alert(1)
                }
            });
        </script>
    </body>
</html>
